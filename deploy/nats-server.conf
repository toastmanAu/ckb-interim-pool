# NATS server — production event bus (TLS + per-edge authorization)
#
#   nats-server -c /etc/nats/nats-server.conf
#
# Clients authenticate with mTLS client certs; the cert CN is the NATS
# username (see deploy/gen-nats-tls.sh). Permissions:
#   edge-<region>  → publish ONLY its own namespace  pool.v1.edge.<id>.>
#   ingest         → subscribe to ALL edge namespaces
#
# $JS.API.>/ $JS.ACK.> are required by the JetStream client for publish acks
# and consumer management. JetStream store lives under /data/jetstream;
# the POOL_V1 stream is created by the first edge to connect.

port: 4222
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1GB
  max_file_store: 20GB
}

tls {
  cert_file: "/etc/nats/tls/server.crt"
  key_file:  "/etc/nats/tls/server.key"
  ca_file:   "/etc/nats/tls/ca.crt"
  verify: true
  # derive the NATS username from the client certificate CN (NATS 2.10+)
  verify_and_map: true
  timeout: 2
}

authorization {
  default_permissions {
    publish:   ["_INBOX.>"]
    subscribe: ["_INBOX.>"]
  }
  users: [
    {
      user: "edge-au"
      permissions: {
        publish:   ["pool.v1.edge.au-adelaide-01.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "edge-eu"
      permissions: {
        publish:   ["pool.v1.edge.eu-frankfurt-01.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "edge-us"
      permissions: {
        publish:   ["pool.v1.edge.us-virginia-01.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "ingest"
      permissions: {
        publish:   ["_INBOX.>", "$JS.API.>", "$JS.ACK.>"]
        subscribe: ["pool.v1.edge.>", "_INBOX.>"]
      }
    }
  ]
}

# observability (bind localhost only in production)
http: 127.0.0.1:8222
