# nginx stream proxy — hides the pool origin IP behind a VPS.
#
# Deploy on a cheap VPS (ideally in the same region as the edge). Miners
# connect to this VPS; it forwards stratum TCP to the home edge over an
# encrypted tunnel (WireGuard/Tailscale — the VPS only ever sees the tunnel
# peer IP, never the public home IP).
#
#   apt install nginx
#   cp nginx-stream.conf /etc/nginx/conf.d/pool-stream.conf
#   nginx -t && systemctl reload nginx
#
# Also proxy the public dashboard (HTTP) if you want miners to reach it
# without exposing the home IP — see the http{} notes at the bottom.

stream {
  # stratum on the standard mining port
  server {
    listen 3333;
    proxy_pass 10.0.0.2:3333;          # edge host via the tunnel interface
    proxy_timeout 300s;
    proxy_connect_timeout 5s;

    # optional: PROXY protocol to the edge so it sees the miner's real IP
    # (requires the edge to accept proxy protocol — see below)
    # proxy_protocol on;
  }

  # optional second port for failover/backup endpoint
  server {
    listen 3334;
    proxy_pass 10.0.0.2:3333;
    proxy_timeout 300s;
  }

  # optional: metrics/health relay (keep private if not needed)
  # server { listen 8082; proxy_pass 10.0.0.2:8082; }
}

