# haproxy TCP proxy — alternative to nginx stream.
#
#   apt install haproxy
#   haproxy -c -f haproxy.cfg
#   systemctl restart haproxy
#
# Sends PROXY protocol to the edge (if enabled) so the edge sees miner IPs
# for per-IP limits. Edge side must accept it (see runbook §endpoints).

global
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client 300s
  timeout server 300s

frontend stratum_au
  bind *:3333
  default_backend edge_au

backend edge_au
  # via the encrypted tunnel (WireGuard/Tailscale interface IP)
  server edge1 10.0.0.2:3333 send-proxy-v2
